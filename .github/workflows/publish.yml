name: Publish to Marketplace

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: xvfb-run -a npm test
      - run: npx vsce package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    # Requires a "marketplace" environment (Settings -> Environments) with at
    # least one required reviewer configured, and a VSCE_PAT secret set on
    # that same environment. The required-reviewer rule is what makes this
    # job wait for manual approval before it runs - nothing below prompts
    # for approval itself.
    environment: marketplace
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vsix
      # vsce reads the token from VSCE_PAT itself; passing it as a --pat
      # argument would also put it in this process's argv.
      - run: npx @vscode/vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

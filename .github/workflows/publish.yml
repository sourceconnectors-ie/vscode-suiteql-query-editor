name: Publish to Marketplace

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: xvfb-run -a npm test
      - run: npx vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Requires a "marketplace" environment (Settings -> Environments) with at
    # least one required reviewer configured, and a VSCE_PAT secret set on
    # that same environment. The required-reviewer rule is what makes this
    # job wait for manual approval before it runs - nothing below prompts
    # for approval itself.
    environment: marketplace
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - run: npx @vscode/vsce publish --packagePath *.vsix --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
